name: validate

# push is restricted to main (post-merge validation): an unrestricted `push:` made every PR-branch
# push run BOTH events (duplicate checks), and version-bump-guard's push-event base (HEAD^) went
# red on any multi-commit PR whose later commit touched a plugin without re-bumping — a false
# positive the pull_request run (which diffs against the base branch) doesn't have.
on:
  push:
    branches: [main]
  pull_request:
  # Manually runnable (1.15.0). Without this, a PR whose checks never register is indistinguishable
  # via the API from "still queueing" and from "Actions is disabled" (#122) — and there is no way to
  # ask for the run. `gh workflow run validate.yml --ref <branch>` (or the Actions tab's "Run
  # workflow") resolves the ambiguity in one command.
  workflow_dispatch:

# The standard's branch-restart loop force-pushes routinely — cancel superseded runs instead of
# queueing them, and cap runtime so a hung ffmpeg can't burn an hour of runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg, shellcheck, and tesseract
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg shellcheck tesseract-ocr

      - name: Run test suite
        run: bash tests/run-tests.sh

  # P0-1: fail when a plugin's files change but its plugin.json `version` doesn't — so a fix
  # can't ship invisibly (installed copies are pinned by version; an unchanged version is a no-op
  # for `claude plugin update`). Brand-new plugins (no version at the base ref) pass.
  version-bump-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history to diff against the base
      - name: Require a version bump when a plugin's files change
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            base="origin/${GITHUB_BASE_REF}"
            git fetch -q origin "${GITHUB_BASE_REF}"
          elif [ "${GITHUB_REF_NAME:-}" = "main" ]; then
            # push to main: HEAD^ is the pre-merge tip, correct for the squash-merges this repo
            # uses. The PR event is the thorough diff-vs-base check.
            base="${GITHUB_SHA}^"
          else
            # workflow_dispatch on a feature branch (added 1.15.0): HEAD^ would be the previous
            # commit ON THE BRANCH, so a second commit that touches a plugin already bumped by the
            # first fails spuriously — the exact multi-commit false positive noted above. Compare
            # against the default branch, which is what the PR event would do.
            git fetch -q origin main
            base="origin/main"
          fi
          git fetch -q --tags origin 2>/dev/null || true
          fail=0
          for dir in plugins/*/; do
            name="$(basename "$dir")"
            manifest="${dir}.claude-plugin/plugin.json"
            [ -f "$manifest" ] || continue
            if ! git diff --quiet "$base" -- "$dir"; then
              old_ver="$(git show "$base:$manifest" 2>/dev/null \
                        | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || echo "")"
              new_ver="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("version",""))' "$manifest")"
              # New plugin (no old_ver) passes; an unchanged version on a changed plugin fails —
              # UNLESS that version was never released. Releases here are hand-cut tags (RELEASING.md),
              # often days after the merge, so a version with no `v<ver>` tag is still UNRELEASED and
              # more work can legitimately be folded into it. Once it's tagged, it's immutable and a
              # further change must bump. This keeps the guard's real purpose — an installed copy is
              # pinned by version, so a released version must never change underneath users.
              if [ -n "$old_ver" ] && [ "$old_ver" = "$new_ver" ]; then
                if git rev-parse -q --verify "refs/tags/v$new_ver" >/dev/null 2>&1; then
                  echo "::error::$name changed but version is still $new_ver, and v$new_ver is already tagged/released — bump $manifest"
                  fail=1
                else
                  echo "::notice::$name changed at version $new_ver — no v$new_ver tag exists, so that release is still unreleased and this is folded into it."
                fi
              fi
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
